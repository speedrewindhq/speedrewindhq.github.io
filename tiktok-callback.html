<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorisation code — Rewind Clip Uploader</title><style>
:root{--ink:#101114;--bg:#fff;--muted:#5b6068;--rule:#e6e8ec}
@media(prefers-color-scheme:dark){:root{--ink:#e9ecf1;--bg:#0d0e11;--muted:#9aa1ab;--rule:#23262c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:72px 16px}
h1{font-size:26px;margin:0 0 8px}
p.sub{color:var(--muted);margin:0 0 28px}
code{display:block;padding:18px;border:1px solid var(--rule);border-radius:10px;
 font:15px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;
 background:rgba(127,127,127,.08)}
button{margin-top:14px;padding:10px 18px;border:1px solid var(--rule);
 border-radius:8px;background:transparent;color:inherit;font-size:15px;cursor:pointer}
.none{color:var(--muted)}
</style></head><body><main>
<h1>Authorisation code</h1>
<p class="sub">Copy this and paste it back into the terminal.</p>
<code id="c" class="none">No code in this link.</code>
<button id="b" hidden>Copy</button>
<script>
var code = new URLSearchParams(location.search).get('code');
if (code) {
  var el = document.getElementById('c');
  el.textContent = code; el.className = '';
  var b = document.getElementById('b'); b.hidden = false;
  b.onclick = function () {
    navigator.clipboard.writeText(code).then(function () {
      b.textContent = 'Copied';
    });
  };
}
</script>
</main></body></html>
