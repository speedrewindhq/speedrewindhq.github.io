<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Authorisation code — SpeedRewind</title>
<style>
  :root{ --bg:#000; --fg:#fff; --muted:#8c8c8c; --green:#12ff00; --line:#1d1d1d; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:24px 16px;
  }
  .card{width:100%;max-width:640px}
  h1{font-size:26px;letter-spacing:-.01em;margin:0 0 6px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 28px;font-size:15px}
  .rule{height:2px;background:var(--green);width:56px;margin:0 0 28px;border:0}
  label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--green);font-weight:700;margin:0 0 8px}
  .code{
    width:100%; background:#0b0b0d; border:1px solid var(--line); border-radius:10px;
    color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:14px 16px; word-break:break-all; min-height:58px;
  }
  button{
    margin-top:14px; background:var(--green); color:#000; border:0; cursor:pointer;
    font:700 15px/1 inherit; padding:13px 22px; border-radius:999px;
  }
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.5;cursor:default}
  .note{color:var(--muted);font-size:14px;margin-top:28px;
        border-top:1px solid var(--line);padding-top:20px}
  .err{color:#ff5a5a}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg)}
</style>
</head>
<body>
<div class="card">

  <h1>Authorisation code</h1>
  <p class="sub">TikTok sent this back after you approved the app.</p>
  <hr class="rule">

  <label for="code">Code</label>
  <div class="code" id="code">Reading…</div>
  <button id="copy" disabled>Copy</button>

  <p class="note" id="note">
    Paste this into Terminal when <code>clipper.py tt-connect</code> asks for it.
    It is single-use and expires within minutes — if it fails, just run the
    authorisation again.
  </p>

</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var box = document.getElementById('code');
  var btn = document.getElementById('copy');
  var note = document.getElementById('note');

  var err = p.get('error');
  var code = p.get('code');

  if (err) {
    box.className = 'code err';
    box.textContent = err + (p.get('error_description')
      ? ' — ' + p.get('error_description') : '');
    note.textContent = 'Authorisation was declined or failed. Run it again.';
    return;
  }
  if (!code) {
    box.textContent = 'No code in the URL.';
    note.textContent = 'Open this page by authorising the app, not directly.';
    return;
  }

  box.textContent = code;
  btn.disabled = false;
  btn.addEventListener('click', function () {
    // clipboard API needs a secure context; fall back to selecting the text
    function done() { btn.textContent = 'Copied'; setTimeout(function () {
      btn.textContent = 'Copy'; }, 1600); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(code).then(done, select);
    } else { select(); }
    function select() {
      var r = document.createRange(); r.selectNodeContents(box);
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); done(); } catch (e) {
        btn.textContent = 'Select and copy'; }
    }
  });
})();
</script>
</body>
</html>
